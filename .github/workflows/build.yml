name: Synth_esis (Schwung ARM64)
on:
  push:
    branches: ['main', 'development-phase12-*', 'development-phase12c-*', 'development-phase12d-*', 'development-phase12e-*', 'development-phase12f-*']
  pull_request:
  workflow_dispatch:
jobs:
  native-and-arm64:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld binutils python3 gcc
      - name: Verify canonical Schwung metadata and readable labels
        run: python3 scripts/pack_metadata.py --check && python3 scripts/generate_metadata.py --check
      - name: Generate independent wavetable data
        run: python3 scripts/generate_tables.py
      - name: Run desktop ABI and audio tests
        run: python3 tests/test_plugin.py
      - name: Render curated 8-16 C3/C4 from actual host DSP
        run: |
          python3 scripts/render_curated_audio_previews.py --output-dir dist/curated-audio-AB
          test "$(find dist/curated-audio-AB -maxdepth 1 -type f -name '*.wav' | wc -l)" -eq 18
      - uses: actions/upload-artifact@v4
        with:
          name: synth_esis-curated-audio-AB
          path: dist/curated-audio-AB/*.wav
          if-no-files-found: error
          retention-days: 30
      - name: Test isolated C spectral-bin prototype
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/test_spectral_bins.c -lm -o /tmp/test_spectral_bins
          /tmp/test_spectral_bins
          cat > /tmp/se_probe.c <<'EOF'
          #include "src/spectral_bins.h"
          void probe(se_complex x[129]) { se_spectral_apply(x,1,1,1,42,127,3); }
          EOF
          clang --target=aarch64-linux-gnu -ffreestanding -nostdinc \
            -isystem "$(clang -print-resource-dir)/include" \
            -O2 -Wall -Wextra -Werror -c -I. /tmp/se_probe.c -o /tmp/test_spectral_bins_arm64.o
          readelf -h /tmp/test_spectral_bins_arm64.o | grep -q AArch64
      - name: Validate compositional spectral corners and DSP smoothing
        run: python3 -m unittest discover -s tests -p 'test_spectral_composition.py'
      - name: Compare C spectral output against Python oracle
        run: python3 -m unittest discover -s tests -p 'test_spectral_c_parity.py'
      - name: Benchmark isolated spectral engine on CI host
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/bench_spectral_bins.c -o /tmp/bench_spectral_bins
          /tmp/bench_spectral_bins
      - name: Test composed spectral audio and oscillator isolation
        run: python3 -m unittest discover -s tests -p 'test_spectral_audio_integration.py'
      - name: Verify compositional spectral reference
        run: python3 -m unittest discover -s tests -p 'test_spectral_reference.py'
      - name: Test Phase 10 spectral shaping prototype and lookup guards
        run: python3 -m unittest discover -s tests -p 'test_spectral_shape.py' && python3 -m unittest discover -s tests -p 'test_phase10_boundary.py' && python3 -m unittest discover -s tests -p 'test_shape_variants.py' && python3 -m unittest discover -s tests -p 'test_custom_wavetable.py' && python3 -m unittest discover -s tests -p 'test_curated_wavetables.py' && python3 -m unittest discover -s tests -p 'test_curated_export.py' && python3 -m unittest discover -s tests -p 'test_curated_header.py' && python3 -m unittest discover -s tests -p 'test_curated_integration.py' && python3 -m unittest discover -s tests -p 'test_aggressive_spectral.py'
      - name: Export 16 curated custom wavetables
        run: |
          python3 scripts/export_curated_wavetables.py --output-dir dist/curated-wavetables
          test "$(find dist/curated-wavetables -maxdepth 1 -name '*.json' | wc -l)" -eq 16
      - uses: actions/upload-artifact@v4
        with:
          name: synth_esis-curated-wavetables-preview
          path: dist/curated-wavetables/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Generate optional curated C bank and check syntax
        run: |
          python3 scripts/generate_curated_header.py --output build/curated_tables.h
          printf '#include "curated_tables.h"\nint main(void){return SYNTH_ESIS_CURATED_COUNT != 16;}\n' > build/curated_header_check.c
          gcc -std=c11 -fsyntax-only -Ibuild build/curated_header_check.c
          clang --target=aarch64-linux-gnu -ffreestanding -nostdinc \
            -isystem "$(clang -print-resource-dir)/include" \
            -O2 -c -Ibuild build/curated_header_check.c -o build/curated_header_check.o
          readelf -h build/curated_header_check.o | grep -q AArch64
          echo "Curated bank syntax and ARM64 object compilation passed; live DSP unchanged."
      - name: Validate Phase 10A preset schema
        run: python3 -m unittest discover -s tests -p 'test_preset_*.py'
      - name: Validate native factory preset export
        run: python3 -m unittest discover -s tests -p 'test_native_factory_export.py'
      - name: Test on-device graphics contract
        run: node tests/test_canvas.cjs
      - name: Cross-compile and assemble Schwung archive
        run: bash scripts/build.sh
      - name: Verify package and binary
        run: python3 tests/check_package.py
      - name: Confirm exact .tar.gz payload before upload
        shell: bash
        run: |
          test -f dist/synth_esis-module.tar.gz
          file dist/synth_esis-module.tar.gz
          tar -tzf dist/synth_esis-module.tar.gz
          test "$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 1
          echo "Artifact payload: dist/synth_esis-module.tar.gz"
          echo "GitHub Actions downloads are ZIP-wrapped by GitHub. Extract the ZIP once to get the .tar.gz."
      - name: Write build diagnostic summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Synth_esis build diagnostics"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Result of each step:"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"
          # A failed step prevents subsequent build steps; GitHub's job page
          # identifies the failing step and retains its full logs.
          echo "Open the run above for the exact failing step and logs." >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: synth_esis-targz-download
          path: dist/synth_esis-module.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Smoke-test Schwung host patch against upstream main
        shell: bash
        run: |
          git clone --depth 1 https://github.com/charlesvestal/schwung.git /tmp/schwung-host
          node scripts/patch_schwung_canvas_only.mjs /tmp/schwung-host
          node --check /tmp/schwung-host/src/shared/param_pages/page_plan.mjs
          node tests/test_schwung_canvas_only.mjs /tmp/schwung-host
          grep -q 'replaceKnobGrid' /tmp/schwung-host/src/shared/param_pages/page_plan.mjs
          grep -q 'canvasReplacesGrid' /tmp/schwung-host/src/shared/param_pages/page_plan.mjs
          echo "Host patch applies and parses. This does not validate hardware behavior."
      - name: Verify navigation and FACE encoder contract
        run: python3 -m unittest discover -s tests -p 'test_navigation_contract.py'
      - name: Export native factory presets for optional manual installation
        run: |
          python3 scripts/export_native_factory.py --output-dir dist/native-factory-presets
          test "$(find dist/native-factory-presets -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 16
      - uses: actions/upload-artifact@v4
        with:
          name: synth_esis-native-factory-presets
          path: dist/native-factory-presets/*.json
          if-no-files-found: error
          retention-days: 30
